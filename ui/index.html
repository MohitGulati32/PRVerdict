<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRVerdict</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 2.5rem 1.5rem;
    }

    .wrap { max-width: 640px; margin: 0 auto; }

    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .tagline { color: #666; font-size: 0.95rem; margin-bottom: 2rem; }

    .input-row { display: flex; gap: 0.6rem; }

    #pr-input {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    #pr-input:focus { outline: 2px solid #111; outline-offset: 1px; }

    #run-btn {
      padding: 0.7rem 1.4rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #run-btn:hover:not(:disabled) { background: #333; }
    #run-btn:disabled { opacity: 0.5; cursor: default; }

    .hint { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }

    #error {
      display: none;
      margin-top: 1.5rem;
      padding: 0.85rem 1rem;
      background: #fdecea;
      color: #7a2a20;
      border: 1px solid #f3c6bf;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    #loading {
      display: none;
      margin-top: 2rem;
      align-items: center;
      gap: 0.6rem;
      color: #555;
      font-size: 0.95rem;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; margin-top: 2rem; }

    .banner {
      border-radius: 10px;
      padding: 1.4rem 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid transparent;
    }
    .banner-top {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .banner .decision {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .banner .pr-ref { font-size: 0.85rem; opacity: 0.8; }
    .banner .summary-badges {
      margin-top: 0.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .summary-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid currentColor;
    }

    .banner-ready       { background: #e6f4ea; border-color: #b7dfc3; color: #1a7f37; }
    .banner-blocked     { background: #fdecea; border-color: #f3c6bf; color: #c0342a; }
    .banner-needs_human_review { background: #fff8e1; border-color: #f1e0a3; color: #8a6d00; }

    .criteria-list {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      overflow: hidden;
    }

    details.criterion { border-bottom: 1px solid #eee; }
    details.criterion:last-child { border-bottom: none; }

    details.criterion summary {
      list-style: none;
      cursor: pointer;
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    details.criterion summary::-webkit-details-marker { display: none; }

    .criterion-name { font-size: 0.95rem; font-weight: 600; }

    .row-right { display: flex; align-items: center; gap: 0.6rem; }

    .badge {
      display: inline-block;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge-pass         { background: #e6f4ea; color: #1a7f37; }
    .badge-fail         { background: #fdecea; color: #c0342a; }
    .badge-needs_review { background: #fff8e1; color: #8a6d00; }

    .chevron {
      color: #999;
      font-size: 0.75rem;
      transition: transform 0.15s ease;
    }
    details.criterion[open] .chevron { transform: rotate(90deg); }

    .reasoning {
      padding: 0 1.1rem 1rem 1.1rem;
      font-size: 0.88rem;
      color: #444;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PRVerdict</h1>
    <div class="tagline">PR readiness gate, judged criterion by criterion.</div>

    <div class="input-row">
      <input
        id="pr-input"
        type="text"
        placeholder="https://github.com/owner/repo/pull/123 or owner/repo#123"
        autocomplete="off"
      />
      <button id="run-btn">Run</button>
    </div>
    <div class="hint">Paste a PR URL, or type it as owner/repo#123.</div>

    <div id="error"></div>

    <div id="loading">
      <div class="spinner"></div>
      <span>Running checks — fetching the PR and scoring six criteria…</span>
    </div>

    <div id="results">
      <div id="banner" class="banner"></div>
      <div id="criteria-list" class="criteria-list"></div>
    </div>
  </div>

  <script>
    const API = ''; // same origin

    const CRITERIA_ORDER = [
      'test_coverage',
      'change_risk',
      'rollback_readiness',
      'ownership',
      'service_criticality',
      'incident_history',
    ];
    const CRITERIA_LABELS = {
      test_coverage: 'Test Coverage',
      change_risk: 'Change Risk',
      rollback_readiness: 'Rollback Readiness',
      ownership: 'Ownership',
      service_criticality: 'Service Criticality',
      incident_history: 'Incident History',
    };
    const SCORE_LABELS = { pass: 'Pass', fail: 'Fail', needs_review: 'Needs review' };
    const DECISION_LABELS = {
      ready: 'Ready to ship',
      blocked: 'Blocked',
      needs_human_review: 'Needs human review',
    };

    const input = document.getElementById('pr-input');
    const runBtn = document.getElementById('run-btn');
    const errorEl = document.getElementById('error');
    const loadingEl = document.getElementById('loading');
    const resultsEl = document.getElementById('results');
    const bannerEl = document.getElementById('banner');
    const listEl = document.getElementById('criteria-list');

    function setBusy(busy) {
      runBtn.disabled = busy;
      input.disabled = busy;
      loadingEl.style.display = busy ? 'flex' : 'none';
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    // decide()'s summary is short and structural, e.g. "Blocked: x failed.
    // Needs review: y, z." - split on sentence boundaries so each clause
    // (Blocked/Needs review group) renders as its own compact tag instead
    // of one run-on paragraph.
    function summaryTags(summary) {
      return summary
        .split('. ')
        .map((clause) => clause.replace(/\.$/, '').trim())
        .filter(Boolean);
    }

    function renderResults(data) {
      bannerEl.className = 'banner banner-' + data.decision;
      const tags = summaryTags(data.summary)
        .map((clause) => `<span class="summary-tag">${clause}</span>`)
        .join('');
      bannerEl.innerHTML = `
        <div class="banner-top">
          <span class="decision">${DECISION_LABELS[data.decision] || data.decision}</span>
          <span class="pr-ref">${data.repo}#${data.pr_number}</span>
        </div>
        <div class="summary-badges">${tags}</div>
      `;

      listEl.innerHTML = '';
      for (const id of CRITERIA_ORDER) {
        const result = data.criteria[id];
        if (!result) continue;

        const details = document.createElement('details');
        details.className = 'criterion';

        const summary = document.createElement('summary');
        summary.innerHTML = `
          <span class="criterion-name">${CRITERIA_LABELS[id] || id}</span>
          <span class="row-right">
            <span class="badge badge-${result.score}">${SCORE_LABELS[result.score] || result.score}</span>
            <span class="chevron">&#9656;</span>
          </span>
        `;

        const reasoning = document.createElement('div');
        reasoning.className = 'reasoning';
        reasoning.textContent = result.reasoning;

        details.appendChild(summary);
        details.appendChild(reasoning);
        listEl.appendChild(details);
      }

      resultsEl.style.display = 'block';
    }

    async function runCheck() {
      const pr = input.value.trim();
      errorEl.style.display = 'none';
      if (!pr) {
        showError('Enter a PR URL or owner/repo#number first.');
        return;
      }

      resultsEl.style.display = 'none';
      setBusy(true);

      try {
        const res = await fetch(`${API}/check`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pr }),
        });

        if (!res.ok) {
          let detail = res.statusText;
          try {
            const body = await res.json();
            if (body.detail) detail = body.detail;
          } catch (_) {}
          throw new Error(detail);
        }

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        showError(err.message || 'Something went wrong.');
      } finally {
        setBusy(false);
      }
    }

    runBtn.addEventListener('click', runCheck);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runCheck();
    });
  </script>
</body>
</html>
